services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dnd
      POSTGRES_PASSWORD: dnd
      POSTGRES_DB: dnd_master
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dnd -d dnd_master"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
